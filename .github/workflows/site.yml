# This file was autogenerated using `zio-sbt-website` via `sbt generateGithubWorkflow` 
# task and should be included in the git repository. Please do not edit it manually.

name: Website
'on':
  workflow_dispatch: {}
  release:
    types:
    - published
  push:
    branches:
    - master
jobs:
  publish-docs:
    name: Publish Docs
    runs-on: ubuntu-latest
    if: ${{ ((github.event_name == 'release') && (github.event.action == 'published')) || (github.event_name == 'workflow_dispatch') }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        check-latest: true
    - name: Install sbt
      uses: sbt/setup-sbt@v1
    - name: Setup NodeJs
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        registry-url: https://registry.npmjs.org
    - name: Publish Docs to NPM Registry
      run: sbt -J-XX:+UseG1GC -J-Xmx4g -J-Xms4g -J-Xss16m ++2.13.x generateArtifactList docs/publishHashverToNpm
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
